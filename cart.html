<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your cart — NAVRASA</title>
<meta name="description" content="Review your NAVRASA order, edit each bowl's ingredients and add extras before checkout." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./shop.css" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="nav is-stuck">
  <a class="brand" href="/">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="21" r="13" stroke="currentColor" stroke-width="2.4"/><path d="M20 8c0-3 2-5 5-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M14 22c3-2 6-2 9 0" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </span>
    NAVRASA
  </a>
  <a class="btn btn--ghost btn--sm" href="/#menu">Continue shopping</a>
</header>

<main class="page">
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a> <span>/</span> <span>Cart</span></nav>
    <div class="page__head">
      <h1>Your cart</h1>
      <p>Every bowl here can still be changed — swap ingredients, add extras, or bump the quantity.</p>
    </div>

    <div class="split">
      <div>
        <div class="panel" id="cartPanel"></div>
        <div class="panel" id="addonPanel-wrap">
          <h2>Add a little extra</h2>
          <p class="summary__note" style="margin-top:.35rem">Added as its own line, so it shows up on the kitchen sheet.</p>
          <div class="chips" id="addonPanel"></div>
        </div>
      </div>
      <aside class="panel summary" id="summaryPanel"></aside>
    </div>
  </div>
</main>

<script src="./catalog.js"></script>
<script src="./app.js"></script>
<script src="./shop.js"></script>
<script src="./cart.js"></script>
</body>
</html>
