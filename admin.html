<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders dashboard — NAVRASA</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./shop.css" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="nav is-stuck">
  <a class="brand" href="/">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="21" r="13" stroke="currentColor" stroke-width="2.4"/><path d="M20 8c0-3 2-5 5-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M14 22c3-2 6-2 9 0" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </span>
    NAVRASA
  </a>
  <div style="display:flex;gap:.5rem;align-items:center">
    <button class="btn btn--ghost btn--sm" id="refreshBtn" type="button">Refresh</button>
    <a class="btn btn--sm" href="/#menu">Storefront</a>
  </div>
</header>

<main class="admin">
  <div class="wrap">
    <div class="admin__head">
      <div>
        <h1>Orders dashboard</h1>
        <p id="lastUpdated">Reading data/orders.json…</p>
      </div>
    </div>

    <div class="stats-grid" id="stats"></div>

    <div class="admin__tools">
      <div class="filters" id="filters"></div>
      <div class="admin__search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search order ID, name or phone" aria-label="Search orders" />
      </div>
    </div>

    <div class="order-list" id="orderList"></div>
  </div>
</main>

<script src="./catalog.js"></script>
<script src="./admin.js"></script>
</body>
</html>
